name: kansas-release

# Compila o AAB assinado do Kansas IA Financeira na nuvem e, se houver conta
# de serviço da Play, publica. Sem o PC de ninguém ligado.
#
# Sem os secrets de assinatura ele AINDA compila, e marca o artefato como não
# publicável — assim dá para provar que o pipeline funciona antes de existir
# qualquer chave.

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'faixa de destino na Play'
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      rollout:
        description: 'fração do rollout em produção (0.05 = 5%)'
        default: '0.05'
  push:
    paths: ['infra/triggers/*-release.trigger']

env:
  APP_DIR: app
  PACKAGE: com.pulsefinanceiro.dreai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: O fonte do app está aqui?
        run: |
          test -f "$APP_DIR/android/gradlew" || {
            echo "::error::não achei $APP_DIR/android/gradlew nesta ref"; exit 1; }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Android SDK 36 (exigência da Play para atualizações)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$APP_DIR/android/local.properties"

      - name: Portão do targetSdk e do applicationId
        run: |
          python3 kansas/tools/audit_app.py "$APP_DIR" --json auditoria.json >/dev/null || true
          alvo=$(python3 -c "import json;print(json.load(open('auditoria.json'))['identidade'].get('targetSdk','0'))")
          pkg=$(python3 -c "import json;print(json.load(open('auditoria.json'))['identidade'].get('applicationId',''))")
          echo "targetSdk=$alvo  applicationId=$pkg"
          [ "${alvo:-0}" -ge 36 ] || { echo "::error::targetSdk $alvo < 36: a Play recusa"; exit 1; }
          [ "$pkg" = "$PACKAGE" ] || { echo "::error::applicationId $pkg != $PACKAGE"; exit 1; }

      - name: Dependências do app
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Chave de assinatura (se existir)
        id: chave
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "play=sim" >> "$GITHUB_OUTPUT"
          else
            echo "play=nao" >> "$GITHUB_OUTPUT"
            echo "::warning::sem PLAY_SERVICE_ACCOUNT_JSON — não publico, só entrego o AAB"
          fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$APP_DIR/android/app/upload.keystore"
            echo "assinado=sim" >> "$GITHUB_OUTPUT"
            echo "chave de upload presente: o AAB sairá publicável"
          else
            echo "assinado=nao" >> "$GITHUB_OUTPUT"
            echo "::warning::sem ANDROID_KEYSTORE_BASE64 — compila, mas o AAB não serve para a Play"
          fi

      - name: Build do AAB
        working-directory: ${{ env.APP_DIR }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --max-workers=2

      - name: Conferir o que saiu
        run: |
          aab=$(find "$APP_DIR" -name '*.aab' | head -1)
          echo "AAB: $aab ($(du -h "$aab" | cut -f1))"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging \
            "$(find "$APP_DIR" -path '*apk*' -name '*.apk' | head -1)" 2>/dev/null | head -2 || true

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publicar na Play
        if: ${{ steps.chave.outputs.assinado == 'sim' && steps.chave.outputs.play == 'sim' }}
        # SHA não verificado nesta sessão (acesso à API do GitHub é restrito ao
        # repo do projeto); fixar por SHA ao revisar.
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE }}
          releaseFiles: ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ (github.event.inputs.track == 'production') && 'inProgress' || 'completed' }}
          userFraction: ${{ (github.event.inputs.track == 'production') && (github.event.inputs.rollout || '0.05') || '' }}

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Kansas — build ${{ job.status }}"
            echo "- assinado com a chave de upload: ${{ steps.chave.outputs.assinado }}"
            echo "- conta de serviço da Play: ${{ steps.chave.outputs.play }}"
            echo "- faixa: ${{ github.event.inputs.track || 'internal' }}"
            echo "- o .aab está nos artefatos deste run"
          } >> "$GITHUB_STEP_SUMMARY"
