name: kansas-release

# Gera o AAB assinado e envia para a Play SEM depender do PC do Fabio.
#
# Hoje cada atualização depende da máquina dele estar ligada, com o fonte, o
# Android SDK e a keystore. Este workflow move isso para o CI: o único gesto
# que sobra é um push (ou o botão "Run workflow").
#
# Portas que precisam estar abertas (uma vez só):
#   - fonte do app dentro deste repositório, em APP_DIR
#   - secret ANDROID_KEYSTORE_BASE64   (a upload key atual, em base64)
#   - secret ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#   - secret PLAY_SERVICE_ACCOUNT_JSON (conta de serviço com acesso ao app)
#
# Enquanto faltar qualquer uma, o job para com mensagem dizendo exatamente
# qual — nunca gera build meia-boca nem publica coisa errada.

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'faixa de destino'
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      rollout:
        description: 'fração do rollout em produção (0.05 = 5%)'
        default: '0.05'
  push:
    paths: ['infra/triggers/*-release.trigger']

env:
  APP_DIR: app          # onde o fonte do React Native vive dentro do repo
  PACKAGE: com.pulsefinanceiro.dreai

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se o fonte do app está no repositório
        run: |
          if [ ! -f "$APP_DIR/android/gradlew" ]; then
            echo "::error::fonte do app não encontrado em '$APP_DIR/android'."
            echo "Sem o código aqui, o build continua preso ao PC. Traga o"
            echo "projeto React Native para '$APP_DIR/' e rode de novo."
            exit 1
          fi

      # Porta 1: a Play recusa upload abaixo de API 36 desde 31/08/2026.
      # Melhor descobrir aqui, em 5 segundos, do que depois do upload.
      - name: Portão do target SDK (exigência da Play)
        run: python3 kansas/tools/audit_app.py "$APP_DIR" --require-target 36 --json auditoria.json || true

      - name: Falhar se o targetSdk não atender
        run: |
          alvo=$(python3 -c "import json;print(json.load(open('auditoria.json'))['identidade'].get('targetSdk','0'))")
          if [ "${alvo:-0}" -lt 36 ]; then
            echo "::error::targetSdk=$alvo — a Play recusa atualizações abaixo de 36."
            exit 1
          fi
          echo "targetSdk=$alvo — ok para enviar."

      - name: Conferir que o applicationId não mudou
        run: |
          atual=$(python3 -c "import json;print(json.load(open('auditoria.json'))['identidade'].get('applicationId',''))")
          if [ "$atual" != "$PACKAGE" ]; then
            echo "::error::applicationId '$atual' != '$PACKAGE'."
            echo "Trocar o applicationId faz a Play tratar isto como OUTRO app"
            echo "e os usuários atuais param de receber atualização."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: app/package-lock.json }

      - name: Instalar dependências
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Restaurar a keystore de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret ANDROID_KEYSTORE_BASE64 ausente."
            echo "Sem a upload key original, a Play rejeita o AAB: a identidade"
            echo "de assinatura precisa continuar a mesma do app publicado."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$APP_DIR/android/app/upload.keystore"

      - name: Próximo versionCode direto da Play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "$PLAY_JSON" > /tmp/play.json
            pip install --quiet cryptography
            PLAY_SERVICE_ACCOUNT_JSON=/tmp/play.json \
              python3 kansas/tools/play_status.py "$PACKAGE" | tee play-status.txt
          else
            echo "sem PLAY_SERVICE_ACCOUNT_JSON: versionCode virá do Gradle"
          fi

      - name: Build do AAB assinado
        working-directory: ${{ env.APP_DIR }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/*.aab

      - name: Enviar para a Play
        # NÃO consegui verificar o SHA desta action nesta sessão (o acesso à
        # API do GitHub é restrito ao repo do projeto), então deixo a tag em vez
        # de um SHA que eu não conferi. Trocar por SHA fixo ao revisar.
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE }}
          releaseFiles: ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/*.aab
          # nunca 100% de cara numa mudança grande
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ (github.event.inputs.track == 'production') && 'inProgress' || 'completed' }}
          userFraction: ${{ (github.event.inputs.track == 'production') && (github.event.inputs.rollout || '0.05') || '' }}

      - name: Registrar evidência no repositório
        if: always()
        run: |
          mkdir -p evidence
          f="evidence/${{ github.run_id }}-release.md"
          {
            echo "# release ${{ github.run_id }}"
            echo "- resultado: ${{ job.status }}"
            echo "- faixa: ${{ github.event.inputs.track || 'internal' }}"
            echo "- commit: ${{ github.sha }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            [ -f play-status.txt ] && { echo; echo '```'; cat play-status.txt; echo '```'; }
          } > "$f"
          git config user.name  "kansas-release"
          git config user.email "noreply@anthropic.com"
          git add "$f" && git commit -m "evidence: release ${{ github.run_id }}" && git push || true
