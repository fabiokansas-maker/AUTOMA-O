name: Security audit (weekly via Hostinger API)

on:
  schedule:
    - cron: '0 13 * * 1'   # toda segunda 10h BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    if: github.repository == 'fabiokansas-maker/AUTOMA-O'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/download-local-files-5hfmT

      - name: Auditar via Hostinger API
        id: audit
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          TS=$(date -u +%FT%TZ)
          OUT=evidence/$(date -u +%F)-security-audit.md
          {
            echo "# Security audit — $TS"
            echo ""
            if [ -z "${HOSTINGER_API_TOKEN:-}" ]; then
              echo "## ⚠️ HOSTINGER_API_TOKEN ausente — auditoria não pode rodar"
              echo ""
              echo "Cadastrar em GitHub → Settings → Secrets and variables → Actions"
              exit 0
            fi
            echo "## VPS info"
            curl -fsS -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
              https://developers.hostinger.com/api/vps/v1/virtual-machines/1621330 \
              | python3 -m json.tool || echo "(falha ao consultar info)"
            echo ""
            echo "## Metrics (disco / CPU / RAM)"
            curl -fsS -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
              https://developers.hostinger.com/api/vps/v1/virtual-machines/1621330/metrics \
              | python3 -m json.tool || echo "(falha ao consultar metrics)"
            echo ""
            echo "## Run URL"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$OUT"

      - name: Commit evidência
        run: |
          set -Eeuo pipefail
          git config user.name "security-audit[bot]"
          git config user.email "security-audit@users.noreply.github.com"
          git add evidence/ || true
          git commit -m "evidence: security-audit $(date -u +%F)" || true
          for i in 1 2 3 4; do
            git pull --rebase origin claude/download-local-files-5hfmT && \
            git push origin HEAD:claude/download-local-files-5hfmT && break
            sleep $((2**i))
          done

      - name: Notify Telegram
        if: always()
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -Eeuo pipefail
          [ -z "${BOT:-}" ] && exit 0
          MSG="🛡️ Security audit semanal: outcome=${{ job.status }} — ver evidence/ no repo."
          curl -fsS -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d chat_id="${CHAT}" -d text="$MSG" >/dev/null || true
