# Override aplicável ao docker-compose existente do n8n-mryj.
# ChatGPT injeta este arquivo via `docker compose -f <existente> -f <este> up -d`
# OU adiciona as labels manualmente ao service n8n-mryj.

services:
  n8n:
    container_name: n8n-mryj
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`srv1621330.hstgr.cloud`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n.middlewares=n8n-auth@file"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

networks:
  traefik_proxy:
    external: true
