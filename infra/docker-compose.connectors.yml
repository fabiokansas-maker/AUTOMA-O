services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-automao}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-multi-db.sh:/docker-entrypoint-initdb.d/02-init-multi-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-automao}"]
      interval: 10s
      timeout: 5s
      retries: 5

  browserless:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:?set in .env}
      CONCURRENT: 5
      TIMEOUT: 60000
    ports:
      - "${BROWSERLESS_PORT:-3001}:3000"

  connectors:
    build:
      context: ../connectors
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER:-automao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-automao}
      BROWSERLESS_URL: http://browserless:3000
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN}
    ports:
      - "${CONNECTORS_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  default:
    name: automao_connectors
