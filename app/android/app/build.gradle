apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

android {
    // IDENTIDADE DE PUBLICAÇÃO — NÃO MUDAR.
    // Trocar isto faz a Play tratar o envio como OUTRO app e os usuários
    // instalados param de receber atualização. A marca visível muda em
    // res/values/strings.xml; o applicationId fica.
    namespace "com.pulsefinanceiro.dreai"

    // API 36 = exigência do Google Play para qualquer atualização enviada
    // desde 31/08/2026.
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.pulsefinanceiro.dreai"
        minSdk 24
        targetSdk 36
        versionCode 190
        versionName "1.9.0"
        resValue "string", "build_config_package", "com.pulsefinanceiro.dreai"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Segredo nunca mora no repositório: vem do ambiente no CI
            // (ANDROID_KEYSTORE_BASE64 é materializada em upload.keystore).
            if (System.getenv("ANDROID_KEYSTORE_PASSWORD")) {
                storeFile file("upload.keystore")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    // Um APK por arquitetura: o aparelho baixa só o que usa.
    // (Na Play isso é automático via AAB; aqui serve para instalar direto.)
    //
    // Só vale para APK: com ':bundle*' o AGP recusa split + bundle juntos
    // ("Multiple shrunk-resources files found"). Descoberto compilando.
    splits {
        abi {
            enable !gradle.startParameter.taskNames.any {
                it.toLowerCase().contains("bundle")
            }
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk false
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Com a chave de upload no ambiente, assina para valer.
            // Sem ela, sai NÃO ASSINADO de propósito: melhor um artefato
            // honestamente inutilizável do que um assinado com chave de debug
            // que alguém poderia tentar enviar para a Play.
            signingConfig System.getenv("ANDROID_KEYSTORE_PASSWORD")
                ? signingConfigs.release : null
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-ktx:1.15.0")
    // WindowCompat/insets: base da correção de edge-to-edge do Android 15+
    implementation("androidx.activity:activity-ktx:1.10.1")
}
